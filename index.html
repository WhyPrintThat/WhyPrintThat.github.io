<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Why Print That | Creative Services</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f0df;
      --cream-dark: #eadfc8;
      --green: #536653;
      --green-dark: #354638;
      --brown: #8b4f3c;
      --brown-dark: #62382d;
      --pink: #c98e7b;
      --black: #29251f;
      --white: #fffaf0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--black);
      line-height: 1.6;
    }

    /* ---------------- NAVIGATION ---------------- */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(247, 240, 223, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--cream-dark);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--black);
    }

    .bug-logo {
      font-size: 34px;
      transform: rotate(-12deg);
    }

    .logo-text {
      font-family: "Shadows Into Light", cursive;
      font-size: 30px;
      font-weight: bold;
    }

    .logo-text span {
      color: var(--green);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--black);
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: var(--brown);
    }

    /* ---------------- HERO ---------------- */

    .hero {
      max-width: 1200px;
      margin: 25px auto 0;
      padding: 65px 60px;
      min-height: 570px;
      border-radius: 25px;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(circle at 90% 10%, rgba(201,142,123,.35), transparent 25%),
        radial-gradient(circle at 10% 90%, rgba(83,102,83,.25), transparent 30%),
        var(--cream-dark);

      display: flex;
      align-items: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 250px;
      background: var(--green);
      opacity: .12;
      transform: rotate(-8deg);
      right: -100px;
      bottom: -70px;
      border-radius: 50%;
    }

    .hero-content {
      max-width: 570px;
      position: relative;
      z-index: 2;
    }

    .small-heading {
      font-family: "Shadows Into Light", cursive;
      color: var(--brown);
      font-size: 24px;
      margin-bottom: 5px;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(52px, 7vw, 82px);
      line-height: .95;
      text-transform: uppercase;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .hero h1 .green {
      color: var(--green);
    }

    .hero h1 .brown {
      color: var(--brown);
    }

    .hero p {
      font-size: 19px;
      max-width: 480px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: var(--brown);
      color: white;
      text-decoration: none;
      padding: 15px 28px;
      border-radius: 50px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: .25s;
      box-shadow: 0 5px 0 var(--brown-dark);
    }

    .button:hover {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--brown-dark);
    }

    /* HERO ART */

    .hero-art {
      position: absolute;
      right: 35px;
      bottom: 0;
      width: 430px;
      height: 480px;
    }

    .person {
      position: absolute;
      right: 70px;
      bottom: 0;
      width: 260px;
      height: 360px;
      background: var(--green);
      border-radius: 140px 140px 30px 30px;
    }

    .head {
      position: absolute;
      width: 165px;
      height: 190px;
      background: #e6b28b;
      border-radius: 50%;
      top: -90px;
      left: 47px;
      border: 5px solid var(--black);
    }

    .hair {
      position: absolute;
      width: 205px;
      height: 245px;
      background: #7a4d35;
      border-radius: 50%;
      top: -115px;
      left: 25px;
      z-index: -1;
    }

    .eye {
      position: absolute;
      width: 34px;
      height: 22px;
      background: white;
      border: 4px solid var(--black);
      border-radius: 50%;
      top: 65px;
    }

    .eye.left {
      left: 35px;
    }

    .eye.right {
      right: 35px;
    }

    .smile {
      position: absolute;
      width: 55px;
      height: 25px;
      border-bottom: 4px solid var(--black);
      border-radius: 50%;
      left: 52px;
      top: 112px;
    }

    .arm {
      position: absolute;
      width: 150px;
      height: 55px;
      background: #e6b28b;
      border: 5px solid var(--black);
      border-radius: 40px;
      left: -90px;
      top: 145px;
      transform: rotate(12deg);
    }

    .hand {
      position: absolute;
      width: 70px;
      height: 55px;
      background: #e6b28b;
      border: 5px solid var(--black);
      border-radius: 50%;
      left: -145px;
      top: 118px;
      z-index: 5;
    }

    /* BUG IN HAND */

    .hand-bug {
      position: absolute;
      font-size: 48px;
      left: -142px;
      top: 115px;
      z-index: 10;
      transform: rotate(-15deg);
    }

    /* ---------------- SERVICES ---------------- */

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 90px 30px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-heading .scribble {
      font-family: "Shadows Into Light", cursive;
      color: var(--brown);
      font-size: 25px;
    }

    .section-heading h2 {
      font-family: "Playfair Display", serif;
      font-size: 48px;
      text-transform: uppercase;
      line-height: 1;
    }

    .section-heading p {
      max-width: 600px;
      margin: 15px auto;
      font-size: 17px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .service-card {
      background: var(--white);
      border: 2px solid var(--cream-dark);
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      transition: .25s;
    }

    .service-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      border-color: var(--pink);
    }

    .service-icon {
      width: 80px;
      height: 80px;
      border: 3px solid var(--green);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 38px;
    }

    .service-card h3 {
      font-family: "Playfair Display", serif;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .service-card p {
      font-size: 14px;
    }

    /* ---------------- ABOUT ---------------- */

    .about {
      background: var(--green-dark);
      color: var(--white);
    }

    .about-inner {
      max-width: 1000px;
      margin: auto;
      padding: 90px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about h2 {
      font-family: "Playfair Display", serif;
      font-size: 52px;
      line-height: 1;
      margin-bottom: 20px;
    }

    .about p {
      font-size: 17px;
      color: #e9e2d2;
    }

    .about-card {
      background: var(--cream);
      color: var(--black);
      padding: 40px;
      border-radius: 25px;
      transform: rotate(2deg);
    }

    .about-card h3 {
      font-family: "Shadows Into Light", cursive;
      color: var(--brown);
      font-size: 32px;
    }

    /* ---------------- CUSTOM ORDERS ---------------- */

    .custom {
      text-align: center;
      background: var(--cream-dark);
      padding: 100px 30px;
    }

    .custom h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 6vw, 65px);
      text-transform: uppercase;
      line-height: 1;
      max-width: 800px;
      margin: 0 auto 20px;
    }

    .custom h2 span {
      color: var(--brown);
    }

    .custom p {
      max-width: 600px;
      margin: 0 auto 30px;
      font-size: 18px;
    }

    /* ---------------- FOOTER ---------------- */

    footer {
      background: var(--brown);
      color: white;
      padding: 30px;
      text-align: center;
    }

    footer .footer-logo {
      font-family: "Shadows Into Light", cursive;
      font-size: 32px;
      margin-bottom: 8px;
    }

    footer p {
      font-size: 14px;
      opacity: .9;
    }

    .socials {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .socials a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 850px) {

      .nav-container {
        padding: 15px 20px;
      }

      .nav-links {
        display: none;
      }

      .hero {
        margin: 15px;
        padding: 45px 25px;
        min-height: 720px;
        align-items: flex-start;
      }

      .hero-content {
        max-width: 100%;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero-art {
        transform: scale(.75);
        transform-origin: bottom right;
        right: -20px;
      }

      .services {
        grid-template-columns: 1fr 1fr;
      }

      .about-inner {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {

      .logo-text {
        font-size: 24px;
      }

      .hero h1 {
        font-size: 43px;
      }

      .hero-art {
        right: -80px;
        transform: scale(.62);
      }

      .services {
        grid-template-columns: 1fr;
      }

      .section-heading h2 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <nav>
