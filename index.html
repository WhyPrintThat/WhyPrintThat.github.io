<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Print That | It's Lame To Be Normal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rust: #9e3b1b;
            --cream-bg: #f5f0e6;
            --dark-green: #2c3e35;
            --text-dark: #2b2b2b;
            --footer-bg: #80301a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--cream-bg); color: var(--text-dark); }

        /* Header Navigation */
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px 5%; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; gap: 20px; }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .logo-beetle { font-size: 2.3rem; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); transform: rotate(-15deg); }
        .logo-text-group { display: flex; align-items: baseline; gap: 8px; }
        .logo-why { font-family: 'Caveat', cursive; font-size: 3rem; color: var(--rust); line-height: 0.8; font-weight: 700; }
        .logo-print { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dark); }

        nav ul { display: flex; list-style: none; gap: 35px; align-items: center; }
        nav a { text-decoration: none; color: var(--text-dark); font-weight: 800; font-size: 1.35rem; letter-spacing: 1px; transition: color 0.2s; }
        nav a:hover { color: var(--rust); }
        .callout-btn { color: var(--rust); position: relative; font-size: 1.4rem; }
        .callout-btn::before { content: "👉 "; font-size: 1.3rem; }
        .callout-btn::after { content: " 👈"; font-size: 1.3rem; }

        /* Hero Section */
        .hero { display: flex; align-items: center; justify-content: space-between; max-width: 1300px; margin: 20px auto; padding: 20px 5%; gap: 40px; }
        .hero-content { flex: 1.1; }
        .hero-title { font-family: 'Caveat', cursive; font-size: 4.5rem; color: var(--text-dark); line-height: 0.95; margin-bottom: 15px; }
        .hero-subtitle { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; font-style: italic; color: var(--rust); letter-spacing: 0.5px; }

        /* Prominent Socials Bar right under Hero */
        .hero-socials { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
        .social-pill { display: flex; align-items: center; gap: 8px; background-color: var(--rust); color: #fff; padding: 12px 22px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: opacity 0.2s, transform 0.2s; }
        .social-pill:hover { opacity: 0.9; transform: translateY(-2px); }

        .hero-image { flex: 0.9; text-align: center; }
        .hero-image img { max-width: 100%; height: auto; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* Services Section */
        .section-header { text-align: center; margin: 40px 0 20px; font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; color: var(--text-dark); display: flex; align-items: center; justify-content: center; gap: 15px; }
        .section-header::before, .section-header::after { content: "—"; color: var(--rust); }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto 40px; padding: 0 5%; text-align: center; }
        .service-card { background: rgba(255,255,255,0.5); padding: 20px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05); }
        .service-card h4 { font-size: 0.95rem; font-weight: 700; margin-top: 10px; color: var(--text-dark); }

        /* Sub-footer Banner */
        .sub-footer { text-align: center; font-weight: 600; font-size: 0.95rem; margin: 30px 0 15px; letter-spacing: 0.5px; }

        /* Footer */
        footer { background-color: var(--footer-bg); color: #fff; display: flex; justify-content: center; align-items: center; padding: 20px 5%; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <span class="logo-beetle">🕷️</span>
            <div class="logo-text-group">
                <span class="logo-why">Why</span>
                <span class="logo-print">Print That</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="https://m.facebook.com/WhyPrintThat/" target="_blank" class="callout-btn">SHOP NOW</a></li>
                <li><a href="https://wa.me/message/EOSXBUQM5L7LO1" target="_blank" class="callout-btn">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title">IT'S LAME<br>TO BE<br>NORMAL.</h2>
            <p class="hero-subtitle">Lets think out of the box.</p>
            
            <!-- Social Links Bar -->
            <div class="hero-socials">
                <a href="https://www.tiktok.com/@whyprintthat" target="_blank" class="social-pill">TikTok 🎵</a>
                <a href="https://m.facebook.com/WhyPrintThat/" target="_blank" class="social-pill">Facebook 📘</a>
                <a href="https://www.instagram.com/whyprintthat?igsh=MWl4M2M3YzVzdXMxdw==" target="_blank" class="social-pill">Instagram 📸</a>
                <a href="https://pin.it/xeTfW5FWP" target="_blank" class="social-pill">Pinterest 📌</a>
            </div>
        </div>
        <div class="hero-image">
            <img src="hero-art.png" alt="Why Print That Illustration">
        </div>
    </section>

    <div class="section-header" id="shop-section">
        WHAT I MAKE
    </div>

    <section class="services-grid">
        <div class="service-card">
            <div style="font-size: 2rem;">🏷️</div>
            <h4>DECALS & STICKERS</h4>
        </div>
        <div class="service-card">
            <div style="font-size: 2rem;">📦</div>
            <h4>3D CREATIONS</h4>
        </div>
        <div class="service-card">
            <div style="font-size: 2rem;">☕</div>
            <h4>MUGS & MORE</h4>
        </div>
    </section>

    <div class="sub-footer">
        CUSTOM PRINTS • 3D CREATIONS • CRAFTED JUST FOR YOU!
    </div>

    <footer>
        <div>✉️ WHYPRINTTHAT@GMAIL.COM</div>
    </footer>

</body>
</html>
